name: CAPCOT — entrega automática a Imaginantes

on:
  push:
    branches:
      - feature/capcot-video-discovery-continuity
    paths:
      - 'cola/entrada/*.json'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'ID de un paquete o "all" para enviar toda la cola JSON'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: capcot-grok-dispatch-${{ github.event_name == 'workflow_dispatch' && inputs.project_id || github.sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama y cola
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Resolver y validar paquetes
        id: packages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_PROJECT_ID" == "all" ]]; then
              mapfile -t files < <(find cola/entrada -maxdepth 1 -type f -name '*.json' | sort)
            else
              [[ "$INPUT_PROJECT_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::ID de paquete inválido."; exit 1; }
              files=("cola/entrada/${INPUT_PROJECT_ID}.json")
            fi
          else
            mapfile -t files < <(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" | grep -E '^cola/entrada/[^/]+\.json$' || true)
            if [[ "${#files[@]}" -ne 1 ]]; then
              printf 'Se esperaba exactamente un JSON nuevo/modificado; detectados: %s\n' "${#files[@]}"
              printf '%s\n' "${files[@]}"
              exit 1
            fi
          fi
          [[ "${#files[@]}" -gt 0 ]] || { echo "::error::No hay paquetes JSON en cola/entrada."; exit 1; }
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || { echo "::error::No existe: $file"; exit 1; }
            python -m json.tool "$file" >/dev/null
          done
          printf '%s\n' "${files[@]}" > /tmp/capcot-files.txt
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Paquetes validados: ${#files[@]}"

      - name: Verificar configuración del receptor
        env:
          WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.GROK_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL" || { echo "::error::Falta configurar GROK_WEBHOOK_URL."; exit 1; }
          case "$WEBHOOK_URL" in https://*) ;; *) echo "::error::GROK_WEBHOOK_URL debe usar HTTPS."; exit 1;; esac
          test -n "$WEBHOOK_TOKEN" || { echo "::error::Falta configurar GROK_WEBHOOK_TOKEN."; exit 1; }

      - name: Entregar paquetes y exigir acuse individual
        env:
          WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.GROK_WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r package_file; do
            [[ -n "$package_file" ]] || continue
            project_id="$(basename "$package_file" .json)"
            export PACKAGE_FILE="$package_file" PROJECT_ID="$project_id"
            python - <<'PY'
          import json, os
          with open(os.environ["PACKAGE_FILE"], encoding="utf-8") as f:
              storyboard = json.load(f)
          payload = {
              "event": "capcot.package.ready",
              "project_id": os.environ["PROJECT_ID"],
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["BRANCH"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "package_path": os.environ["PACKAGE_FILE"],
              "package_url": f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/blob/{os.environ["COMMIT_SHA"]}/{os.environ["PACKAGE_FILE"]}',
              "storyboard": storyboard
          }
          with open("/tmp/capcot-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY
            code="$(curl --silent --show-error --output /tmp/grok-response.json --write-out '%{http_code}' \
              --request POST "$WEBHOOK_URL" \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $WEBHOOK_TOKEN" \
              --data-binary @/tmp/capcot-payload.json)"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] || { echo "::error::$project_id: HTTP $code"; exit 1; }
            python - "$project_id" <<'PY'
          import json, sys
          with open("/tmp/grok-response.json", encoding="utf-8") as f:
              data = json.load(f)
          receipt = data.get("receipt_id")
          if data.get("accepted") is not True or not receipt:
              raise SystemExit(f'{sys.argv[1]}: falta accepted=true y receipt_id verificable')
          print(f'{sys.argv[1]} ACK receipt_id={receipt}')
          PY
            total=$((total + 1))
          done < /tmp/capcot-files.txt
          echo "Entrega confirmada para $total paquete(s)."
