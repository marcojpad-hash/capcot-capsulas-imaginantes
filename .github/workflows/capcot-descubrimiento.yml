name: CAPCOT — descubrimiento de video y continuidad

on:
  push:
    branches:
      - feature/capcot-video-discovery-continuity
    paths:
      - ".github/workflows/capcot-descubrimiento.yml"
  schedule:
    - cron: "30 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capcot-video-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover relevant video-generation projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/buscar_generadores_video.py

      - name: Report filtered catalog size
        run: |
          python - <<'PY'
          import json
          with open('investigacion/generadores_video/catalogo_actual.json', encoding='utf-8') as f:
              data = json.load(f)
          print('Relevant candidates found:', data.get('candidate_count'))
          print('Candidates included:', data.get('returned_count'))
          PY

      - name: Prepare discovery catalog artifact
        run: |
          mkdir -p artifacts
          cp investigacion/generadores_video/catalogo_actual.json artifacts/
          cp investigacion/generadores_video/catalogo_actual.md artifacts/

      - name: Compile CAPCOT scripts
        run: python -m py_compile scripts/validar_continuidad_audiovisual.py scripts/buscar_generadores_video.py scripts/media_api_clients.py scripts/migrar_storyboard_continuidad.py scripts/auditar_assets_storyboard.py tests/test_media_api_clients.py

      - name: Unit test API adapters without network or billing
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Migrate a real capsule into the continuity schema
        run: |
          mkdir -p artifacts
          python scripts/migrar_storyboard_continuidad.py --input salidas/2026-10-29_muralismo-cu/storyboard.json --output /tmp/muralismo-cu-continuidad.json
          python scripts/validar_continuidad_audiovisual.py /tmp/muralismo-cu-continuidad.json | tee artifacts/continuity-validation.txt

      - name: Audit source media availability
        run: |
          python scripts/auditar_assets_storyboard.py salidas/2026-10-29_muralismo-cu/storyboard.json --output artifacts/media-assets-audit.json

      - name: Upload continuity audit
        uses: actions/upload-artifact@v4
        with:
          name: capcot-continuity-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Commit catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investigacion/generadores_video/catalogo_actual.json investigacion/generadores_video/catalogo_actual.md
          if git diff --cached --quiet; then
            echo "No hay cambios en el catálogo."
            exit 0
          fi
          git commit -m "CAPCOT: actualizar catálogo de generadores de video"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
