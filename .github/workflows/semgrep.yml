name: semgrep
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * 1"
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/default --config p/python --sarif --output semgrep.sarif --error
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
