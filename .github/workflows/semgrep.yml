name: semgrep
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan Semgrep
        run: semgrep scan --config p/default --config p/python --sarif --output semgrep.sarif --error

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Preserve SARIF as downloadable artifact
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 7
